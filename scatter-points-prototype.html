<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ヒートマップ散布図（点表示試作） | 今日のレシピ探索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --orange:#e5bb7f; --orange-dark:#ad4315; --orange-soft:#fff0e4; --mint:#54bfa1; --cream:#fff8e9; --paper:#fffdf8; --ink:#36302c; --muted:#6e625a; --line:#ead9c9; --point:#a84c20; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--cream); font-family:"M PLUS Rounded 1c","Hiragino Sans","Noto Sans JP",sans-serif; }
    .page { width:min(1240px,calc(100% - 40px)); margin:0 auto; padding:30px 0 48px; }
    header { margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(24px,3vw,34px); line-height:1.3; }
    header p { max-width:760px; margin:8px 0 0; color:var(--muted); font-size:14px; line-height:1.7; }
    .card { padding:20px; border:1px solid var(--line); border-radius:18px; background:var(--paper); }
    .controls { display:flex; flex-wrap:wrap; align-items:end; gap:12px 16px; margin-bottom:16px; }
    label { display:grid; gap:6px; color:var(--ink); font-size:13px; font-weight:700; }
    input, select, button { font:inherit; }
    input, select { min-height:40px; padding:8px 11px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
    #have-input { width:min(330px,76vw); }
    input:focus, select:focus, button:focus-visible { outline:3px solid rgba(173,67,21,.35); outline-offset:2px; border-color:var(--orange-dark); }
    .zoom-controls { display:flex; align-items:center; gap:5px; padding-bottom:1px; }
    .zoom-controls button { min-height:40px; padding:7px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); cursor:pointer; font-weight:700; }
    .zoom-controls button:hover { border-color:var(--orange); background:var(--orange-soft); color:var(--orange-dark); }
    .overview { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px 16px; align-items:baseline; margin:0 0 12px; }
    .overview h2 { margin:0; font-size:19px; }
    .overview p { margin:0; color:var(--muted); font-size:13px; }
    .overview strong { color:var(--orange-dark); font-size:18px; }
    #chart-wrap { position:relative; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:#fff; }
    #chart { display:block; width:100%; min-height:460px; cursor:grab; touch-action:none; }
    #chart.panning, #chart.panning * { cursor:grabbing !important; }
    #chart .axis path, #chart .axis line { stroke:#d8d5d1; }
    #chart .axis text, #chart .axis-label { fill:var(--muted); font-size:12px; }
    #chart .grid line { stroke:#f1ebe3; }
    #chart .cell { cursor:zoom-in; }
    #chart .cell-count { fill:#8a4a24; font-size:11px; font-weight:700; pointer-events:none; }
    #chart .cell-count.dark { fill:#fff; }
    #chart .recipe-point { cursor:pointer; }
    #chart .recipe-point:hover, #chart .recipe-point.selected { fill-opacity:1; stroke:var(--orange-dark); stroke-width:2.5px; }
    #chart .zoom-label { fill:var(--muted); font-size:12px; font-weight:700; pointer-events:none; }
    .hint { margin:12px 0 0; color:var(--muted); font-size:12px; line-height:1.65; }
    .hint b { color:var(--orange-dark); }
    #selected { min-height:22px; margin:7px 0 0; color:var(--ink); font-size:13px; }
    #selected[hidden] { display:none; }
    .legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin:11px 0 0; color:var(--muted); font-size:12px; }
    .legend span { display:inline-flex; align-items:center; gap:5px; }
    .legend i { width:10px; height:10px; border-radius:50%; background:var(--style-color); }
    .tooltip { position:absolute; z-index:3; max-width:270px; padding:9px 11px; border-radius:10px; background:rgba(54,48,44,.96); color:#fff; box-shadow:0 4px 14px rgba(54,48,44,.2); font-size:12px; line-height:1.55; pointer-events:none; }
    .tooltip[hidden] { display:none; }
    .tooltip strong { display:block; font-size:13px; }
    @media (max-width:650px) { .page { width:min(100% - 24px,1240px); padding-top:18px; } .card { padding:14px; } #chart { min-height:390px; } .zoom-controls { width:100%; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>ヒートマップ散布図：拡大後も点で表示する試作</h1>
      <p>通常時は件数を色で示すヒートマップと上位の点を表示し、2倍以上に拡大すると、料理をアイコンへ切り替えず、すべて小さな点のまま表示します。</p>
    </header>

    <section class="card" aria-label="点表示の散布図試作">
      <div class="controls">
        <label>今ある食材
          <input id="have-input" type="text" value="玉ねぎ、卵" placeholder="例: 玉ねぎ、卵">
        </label>
        <label>横軸の表示上限
          <select id="missing-limit"><option value="5" selected>0〜5個</option><option value="12">0〜12個</option><option value="all">すべて</option></select>
        </label>
        <label>引いて見たときの点の数
          <select id="top-limit"><option value="10">上位10品</option><option value="30" selected>上位30品</option><option value="50">上位50品</option><option value="100">上位100品</option></select>
        </label>
        <div class="zoom-controls" role="group" aria-label="拡大と縮小">
          <button id="zoom-in" type="button" aria-label="拡大">＋</button>
          <button id="zoom-out" type="button" aria-label="縮小">−</button>
          <button id="zoom-reset" type="button">元に戻す</button>
        </div>
      </div>

      <div class="overview"><h2>候補の料理</h2><p id="count" aria-live="polite">料理データを読み込み中…</p></div>
      <div id="chart-wrap">
        <svg id="chart" role="img" aria-label="不足食材数と調理時間によるレシピのヒートマップ散布図"></svg>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
      <div id="legend" class="legend" aria-label="料理の系統の色"></div>
      <p class="hint"><b>試作の違い：</b> 2倍以上へ拡大すると、表示範囲内の全料理を系統ごとの点で表示します。同じ範囲にある料理は、マスの中で自然にばらけるように配置し、拡大倍率に合わせて点も大きくなります。絵文字・写真・料理名ラベルは表示しません。点を選ぶと料理名だけを下に表示します。</p>
      <p id="selected" hidden aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="data-adapter.js"></script>
  <script src="scatter-points-prototype.js"></script>
</body>
</html>
